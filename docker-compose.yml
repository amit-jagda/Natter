services:
  # ---------------------------------------------------------------------------
  # 1. Primary Relational Storage (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: voice-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voice_ai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  # ---------------------------------------------------------------------------
  # 2. In-Memory Cache and Task Queue (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: voice-ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  # ---------------------------------------------------------------------------
  # 3. Core FastAPI Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-ai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-in-production-min-32-chars}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_STT_MODEL: ${GOOGLE_STT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.5-flash-lite}
      STT_PROVIDER: ${STT_PROVIDER:-google}
      TTS_PROVIDER: ${TTS_PROVIDER:-piper}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      CALLING_PROVIDER: ${CALLING_PROVIDER:-twilio}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
      EXOTEL_API_TOKEN: ${EXOTEL_API_TOKEN:-}
      EXOTEL_SUBDOMAIN: ${EXOTEL_SUBDOMAIN:-}
      EXOTEL_CALLER_ID: ${EXOTEL_CALLER_ID:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  # ---------------------------------------------------------------------------
  # 4. Asynchronous Background Task Worker (Arq)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-ai-worker
    restart: unless-stopped
    command: ["arq", "app.workers.worker.WorkerSettings"]
    volumes:
      - ./backend:/app
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CALLING_PROVIDER: ${CALLING_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
      EXOTEL_API_TOKEN: ${EXOTEL_API_TOKEN:-}
      EXOTEL_SUBDOMAIN: ${EXOTEL_SUBDOMAIN:-}
      EXOTEL_CALLER_ID: ${EXOTEL_CALLER_ID:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  # ---------------------------------------------------------------------------
  # 5. Web Dashboard Client (React + Vite + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - platform-network

  # ---------------------------------------------------------------------------
  # 6. LiveKit Real-Time WebRTC Media Server
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.8.0
    container_name: voice-ai-livekit
    restart: unless-stopped
    command: ["--dev"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - platform-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  platform-network:
    driver: bridge


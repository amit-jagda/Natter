name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Validation: Linting & Unit Testing
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voice_ai_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Run Ruff Linting
        working-directory: ./backend
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-github-actions-continuous-integration-32ch
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voice_ai_platform_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest -v --tb=short tests/

  # ---------------------------------------------------------------------------
  # 2. Frontend Validation: TypeScript Check & Production Build
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: TypeScript Strict Validation
        working-directory: ./frontend
        run: |
          npx tsc -b

      - name: Production Vite Build
        working-directory: ./frontend
        run: |
          npm run build

